version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: julia
    directory: "/format"
    schedule:
      interval: weekly
  - package-ecosystem: julia
    directory: "/test"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "Test"   # standard library; Dependabot proposes a spurious bound
